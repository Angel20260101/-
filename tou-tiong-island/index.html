<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#fcf8ef" />
<title>透中島</title>
<meta name="description" content="《透中島》：免註冊的 3 分鐘職場情境故事。每天一鍵決定島上的天氣，想探索的時候再走一座島。" />
<link rel="icon" href="./favicon.svg" />
</head>
<body>
  <div id="app">
    <div id="sky" class="sky"><div class="sky__sun" data-weather="sunny"></div></div>
    <canvas id="map" aria-label="透中島群島地圖"></canvas>
    <div id="veil" class="veil"></div>
    <div id="labels" class="label-layer"></div>

    <header class="hud">
      <div class="hud__brand">
        <span class="hud__title">透中島</span>
        <span class="hud__sub" id="weather-line">中午十二點的島</span>
      </div>
      <nav class="rail group group--stack" aria-label="主選單">
        <button type="button" class="pill" data-action="reset-view" aria-label="切換視角">
          <svg class="pill__icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M12 3h5v5M17 3l-6 6M8 17H3v-5M3 17l6-6"/>
          </svg>
          <span class="rail__text" data-label-view>全景</span>
        </button>
        <button type="button" class="pill" data-action="records" aria-label="我的紀錄">
          <svg class="pill__icon" viewBox="0 0 20 20" aria-hidden="true">
            <path d="M3 5h14M3 10h14M3 15h9"/>
          </svg>
          <span class="rail__text">我的紀錄</span>
        </button>
        <button type="button" class="pill" data-action="login" aria-label="用保存代碼接回紀錄">
          <svg class="pill__icon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="7" cy="10" r="3.4"/>
            <path d="M10.4 10H17M14.5 10v3M17 10v2.4"/>
          </svg>
          <span class="rail__text">登入</span>
        </button>
        <button type="button" class="pill" data-action="about" aria-label="關於這款遊戲">
          <svg class="pill__icon" viewBox="0 0 20 20" aria-hidden="true">
            <circle cx="10" cy="10" r="7.4"/>
            <path d="M10 13.6v-3.2M10 7.1h.01"/>
          </svg>
          <span class="rail__text">關於</span>
        </button>
      </nav>
    </header>

    <div class="hud__hint" id="hint">拖曳可以轉動群島，雙指縮放。點文字就能進去。</div>

    <div id="overlay" class="overlay" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <noscript>《透中島》需要啟用 JavaScript 才能執行。</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
