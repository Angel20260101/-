<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#fcf8ef" />
<title>透中島</title>
<meta name="description" content="《透中島》：免註冊的 3 分鐘職場情境故事。每天一鍵決定島上的天氣，想探索的時候再走一座島。" />
<link rel="icon" href="./favicon.svg" />
</head>
<body>
  <div id="app">
    <div id="sky" class="sky"><div class="sky__sun" data-weather="sunny"></div></div>
    <canvas id="map" aria-label="透中島群島地圖"></canvas>
    <div id="labels" class="label-layer"></div>

    <header class="hud">
      <div class="hud__brand">
        <span class="hud__title">透中島</span>
        <span class="hud__sub" id="weather-line">中午十二點的島</span>
      </div>
      <div class="hud__actions">
        <button type="button" class="hud__btn" data-action="reset-view" aria-label="切換視角">全覽</button>
        <button type="button" class="hud__btn" data-action="about" aria-label="關於這款遊戲">關於</button>
      </div>
    </header>

    <div class="hud__hint" id="hint">拖曳可以轉動群島，雙指縮放。點文字就能進去。</div>

    <div id="overlay" class="overlay" hidden></div>
    <div id="toast" class="toast" hidden></div>
  </div>
  <noscript>《透中島》需要啟用 JavaScript 才能執行。</noscript>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
